<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" aria-labelledby="title desc">
  <title id="title">Two views of the PV Delta Streamlit demo</title>
  <desc id="desc">Illustrated previews of the live synthetic dashboard. Overview shows two analyzed modules and one hot region candidate. Candidate review shows a 10 kelvin rise above a 30 degree Celsius reference.</desc>
  <rect width="960" height="424" rx="16" fill="#e3eff0"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="30" y="44" fill="#173646" font-size="26" font-weight="700">Inside the Streamlit demo</text>
    <text x="30" y="70" fill="#375869" font-size="16">One synthetic inspection, from overview to pixel evidence.</text>
    <rect x="28" y="96" width="442" height="300" rx="12" fill="#fff" stroke="#b1c9cf"/>
    <rect x="490" y="96" width="442" height="300" rx="12" fill="#fff" stroke="#b1c9cf"/>
    <text x="50" y="132" fill="#173646" font-size="20" font-weight="700">Overview</text>
    <text x="512" y="132" fill="#173646" font-size="20" font-weight="700">Review candidates</text>
    <path d="M50 146H447 M512 146H909" stroke="#d1dfe3"/>
    <path d="M50 146h88 M512 146h169" stroke="#087e7e" stroke-width="3"/>
    <g fill="#173646" font-size="25" font-weight="700">
      <text x="50" y="184">2</text>
      <text x="185" y="184">1</text>
      <text x="310" y="184">40 °C</text>
    </g>
    <g fill="#456373" font-size="13">
      <text x="50" y="207">Modules analyzed</text>
      <text x="185" y="207">Hot region candidates</text>
      <text x="310" y="207">Peak grid temperature</text>
    </g>
    <text x="50" y="245" fill="#173646" font-size="15" font-weight="600">Native row 29</text>
    <path d="M82 267H446 M82 328H446" stroke="#d1dfe3" stroke-dasharray="3 4"/>
    <path d="M82 328h78v-61h23v61h263" fill="none" stroke="#087e7e" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#456373" font-size="12">
      <text x="49" y="272">40 °C</text>
      <text x="49" y="333">30 °C</text>
      <text x="264" y="356" text-anchor="middle">Native column (px)</text>
    </g>
    <rect x="512" y="163" width="222" height="127" rx="5" fill="#27717c"/>
    <g fill="none" stroke="#b1e1dd" stroke-width="1.3">
      <rect x="528" y="183" width="80" height="87"/>
      <rect x="639" y="183" width="79" height="87"/>
    </g>
    <rect x="559.6" y="214.6" width="13.9" height="13.9" fill="#ffb664" stroke="#fff4dd" stroke-width="2"/>
    <text x="756" y="189" fill="#173646" font-size="14" font-weight="650">demo-01 · Hot region</text>
    <text x="756" y="232" fill="#96521c" font-size="34" font-weight="750">+10.0 K</text>
    <text x="756" y="256" fill="#456373" font-size="14">Local ΔT</text>
    <path d="M512 311H909" stroke="#d1dfe3"/>
    <text x="512" y="344" fill="#173646" font-size="16" font-weight="700">40.0 °C</text>
    <text x="512" y="366" fill="#456373" font-size="13">Region temperature</text>
    <text x="654" y="344" fill="#173646" font-size="16" font-weight="700">30.0 °C</text>
    <text x="654" y="366" fill="#456373" font-size="13">Local reference</text>
    <text x="792" y="344" fill="#173646" font-size="16" font-weight="700">49 px</text>
    <text x="792" y="366" fill="#456373" font-size="13">Native support</text>
  </g>
</svg>
