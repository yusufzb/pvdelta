<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" role="img" aria-labelledby="title desc">
  <title id="title">PV Delta</title>
  <desc id="desc">Radiometric solar inspection. An illustrated solar array shows a warm region on one module.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24V0H24" fill="none" stroke="#7cd5d6" stroke-opacity=".14"/>
    </pattern>
    <pattern id="cells" width="29" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="23" rx="2" fill="#21616d"/>
      <path d="M13 1v21M1 11.5h24" stroke="#80cacb" stroke-opacity=".35"/>
    </pattern>
    <radialGradient id="heat">
      <stop stop-color="#ffe0a4"/>
      <stop offset=".43" stop-color="#f89d59"/>
      <stop offset=".75" stop-color="#b96370" stop-opacity=".84"/>
      <stop offset="1" stop-color="#b96370" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="960" height="358" rx="21"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="358" fill="#112335"/>
    <path d="M530 0H960V358H466Z" fill="#143549"/>
    <rect x="478" width="482" height="358" fill="url(#grid)"/>
    <g transform="translate(628 40) rotate(17)">
      <g stroke="#81c0c4" stroke-width="1.25">
        <rect width="116" height="260" rx="4" fill="url(#cells)"/>
        <rect x="141" width="116" height="260" rx="4" fill="url(#cells)"/>
        <path d="M2 79H114 M2 157H114 M143 79H255 M143 157H255"/>
      </g>
      <ellipse cx="186" cy="123" rx="29" ry="34" fill="url(#heat)"/>
      <path d="M166 117v-15h15 m11 0h15v15 m0 12v15h-15 m-11 0h-15v-15" fill="none" stroke="#ffdda6" stroke-width="2"/>
    </g>
    <path d="M792 226h90l19 20" fill="none" stroke="#ffc88d" stroke-width="1.5"/>
    <circle cx="792" cy="226" r="4" fill="#ffc88d"/>
    <g font-family="Inter, system-ui, sans-serif">
      <path d="M56 71h33l-16 24Z" fill="none" stroke="#82e9d1" stroke-width="3" stroke-linejoin="round"/>
      <text x="104" y="89" fill="#9de7d6" font-size="20" font-weight="650">Solar inspection toolkit</text>
      <text x="53" y="166" fill="#f4faf9" font-size="68" font-weight="750" letter-spacing="-3">PV Delta</text>
      <text x="57" y="220" fill="#e2edf3" font-size="29">From thermal imagery</text>
      <text x="57" y="258" fill="#e2edf3" font-size="29">to reviewable evidence.</text>
      <text x="57" y="312" fill="#b8ccd9" font-size="17">DJI R-JPEG · Streamlit · DuckDB</text>
      <text x="816" y="275" fill="#ffe0ac" font-size="15">Thermal candidate</text>
    </g>
  </g>
</svg>
