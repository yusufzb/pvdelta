<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic hot region</title>
  <desc id="desc">A cross-section through row 29 of the synthetic demo. The reference is 30 degrees Celsius and pixels 24 through 30 are 40 degrees, a difference of 10 kelvin.</desc>
  <rect width="900" height="340" rx="20" fill="#101d2d"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="48" y="49" fill="#72e2cf" font-size="13" font-weight="700" letter-spacing="2">PV DELTA / SYNTHETIC DEMO</text>
    <text x="48" y="85" fill="#f1f5f9" font-size="27" font-weight="700">Thermal profile across two modules</text>
    <text x="652" y="152" fill="#fbbf72" font-size="44" font-weight="700">+10 K</text>
    <text x="652" y="181" fill="#becbd9" font-size="15">above the local reference</text>
    <g fill="#becbd9" font-size="14">
      <text x="48" y="141">40 °C</text>
      <text x="48" y="241">30 °C</text>
      <text x="108" y="280" text-anchor="middle">0</text>
      <text x="232" y="280" text-anchor="middle">28</text>
      <text x="356" y="280" text-anchor="middle">56</text>
      <text x="480" y="280" text-anchor="middle">84</text>
      <text x="604" y="280" text-anchor="middle">112</text>
      <text x="356" y="308" text-anchor="middle">Native column (px)</text>
    </g>
  </g>
  <path d="M108 136H604 M108 236H604" stroke="#3a4d62" stroke-dasharray="4 5"/>
  <path d="M108 260H604 M108 256V264 M232 256V264 M356 256V264 M480 256V264 M604 256V264" stroke="#718499"/>
  <path d="M143 252H321 M391 252H569" stroke="#718499" stroke-width="3" stroke-linecap="round"/>
  <path d="M214.286 236V136H245.286V236Z" fill="#fbbf72" fill-opacity=".18"/>
  <path d="M108 236H214.286 M245.286 236H604" stroke="#72e2cf" stroke-width="4" stroke-linecap="round"/>
  <path d="M214.286 236V136H245.286V236" fill="none" stroke="#fbbf72" stroke-width="4" stroke-linejoin="round"/>
  <path d="M652 222H676" stroke="#72e2cf" stroke-width="4" stroke-linecap="round"/>
  <path d="M652 250H676" stroke="#fbbf72" stroke-width="4" stroke-linecap="round"/>
  <g fill="#becbd9" font-size="14" font-family="system-ui, -apple-system, sans-serif">
    <text x="686" y="227">30 °C reference</text>
    <text x="686" y="255">40 °C hot region</text>
  </g>
</svg>
