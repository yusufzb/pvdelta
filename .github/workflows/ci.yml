name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,dashboard,vision,storage]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Run SDK-independent tests
        run: python -m pytest -m "not sdk" -q -ra
      - name: Show SDK integration availability
        # Hosted CI has no proprietary SDK or field image. A skip is expected,
        # and is not evidence that real-frame decoding has been validated.
        run: python -m pytest -m sdk -q -ra
