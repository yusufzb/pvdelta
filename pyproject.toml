[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvdelta"
version = "0.1.0.dev0"
description = "Radiometric ΔT inspection of PV modules from DJI R-JPEG, aligned with IEC TS 62446-3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yusufzb" }]
keywords = ["photovoltaic", "thermography", "IEC 62446-3", "DJI", "R-JPEG", "drone", "inspection"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["sdk: integration tests requiring the DJI Thermal SDK and an original sample R-JPEG"]

[tool.ruff]
line-length = 100
target-version = "py310"
